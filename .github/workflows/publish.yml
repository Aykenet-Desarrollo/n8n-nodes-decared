# First publication needs the npm account/org and a granular NPM_TOKEN.
# Afterwards configure npm Trusted Publisher for this repository/publish.yml.
name: Publish
on:
  push:
    tags:
      - '*.*.*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Verify tag matches package version
        run: node -e "if (process.env.GITHUB_REF_NAME !== require('./package.json').version) process.exit(1)"
      - name: Publish the already tagged version
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
